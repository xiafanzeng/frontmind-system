name: Dashboard CI and release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - pdf-runtime-updated

concurrency:
  group: dashboard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promotion-gate:
    name: Verify exact production source before build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: verify
        name: Verify PR, merge tree and exact successful PR workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/verify-promotion-main-push.sh
          echo "source_sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

  changes:
    name: Detect PDF base changes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pdf_runtime_changed: ${{ steps.paths.outputs.pdf_runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A push may contain more than one commit. The event's `before` SHA
          # must remain available so the PDF-runtime path gate compares the
          # complete pushed range rather than only the last commit.
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          if [[ "$before" =~ ^0+$ ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r --root "$GITHUB_SHA")"
          else
            git cat-file -e "${before}^{commit}" 2>/dev/null \
              || { echo "PUSH_BASE_COMMIT_UNAVAILABLE:$before" >&2; exit 1; }
            changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
          fi
          if grep -qE '^(deploy/1panel-node-pdf/|\.github/workflows/pdf-runtime\.yml$|scripts/(assert-current-pdf-runtime-revision|mark-ghcr-promoted)\.mjs$)' <<<"$changed"; then
            echo 'pdf_runtime_changed=true' >>"$GITHUB_OUTPUT"
          else
            echo 'pdf_runtime_changed=false' >>"$GITHUB_OUTPUT"
          fi

  quality:
    name: Type, test and repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: mysql://unused:unused@127.0.0.1:3306/frontmind_ci_config_only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:governance
      - run: node scripts/check-migration-append-only.mjs
      - run: pnpm exec drizzle-kit check
      - run: pnpm test
      - run: pnpm test:registry-retention
      - run: pnpm test:release:repository

  mysql-acceptance:
    name: MySQL 8.4.10 / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - state-machine
          - production-e2e
          - migration-upgrade-base-ref
          - migration-upgrade-historical
          - additive-release
          - auth-transactions
    services:
      mysql:
        # Pin the Docker Official Images ECR mirror so pre-job service setup is
        # not coupled to Docker Hub's anonymous pull limits or availability.
        image: public.ecr.aws/docker/library/mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: frontmind-ci-root-only
          MYSQL_DATABASE: frontmind_kb_acceptance_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:frontmind-ci-root-only@127.0.0.1:3306/frontmind_kb_acceptance_ci
      FRONTMIND_KB_MYSQL_ACCEPTANCE_DATABASE_URL: mysql://root:frontmind-ci-root-only@127.0.0.1:3306/frontmind_kb_acceptance_ci
      FRONTMIND_AUTH_MYSQL_ACCEPTANCE_DATABASE_URL: mysql://root:frontmind-ci-root-only@127.0.0.1:3306/frontmind_kb_acceptance_ci
      FRONTMIND_RELEASE_MYSQL_ACCEPTANCE_DATABASE_URL: mysql://root:frontmind-ci-root-only@127.0.0.1:3306/frontmind_kb_acceptance_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'state-machine'
        run: pnpm test:kb:mysql-acceptance
      - if: matrix.suite == 'production-e2e'
        run: pnpm test:kb:mysql-e2e-acceptance
      - if: matrix.suite == 'migration-upgrade-base-ref'
        env:
          FRONTMIND_PR_BASE_REF: ${{ github.base_ref }}
          FRONTMIND_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            FRONTMIND_UPGRADE_BASE_REF="origin/$FRONTMIND_PR_BASE_REF"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$FRONTMIND_PUSH_BEFORE" =~ ^[a-f0-9]{40}$ && ! "$FRONTMIND_PUSH_BEFORE" =~ ^0+$ ]]; then
            # A push can contain several commits. Test the complete remote
            # before -> current range, not only the final commit's parent.
            FRONTMIND_UPGRADE_BASE_REF="$FRONTMIND_PUSH_BEFORE"
          else
            FRONTMIND_UPGRADE_BASE_REF="$GITHUB_SHA^"
          fi
          export FRONTMIND_UPGRADE_BASE_REF
          node scripts/ci-verify-mysql-migration-upgrade.mjs
      - if: matrix.suite == 'migration-upgrade-historical'
        env:
          FRONTMIND_UPGRADE_BASE_IDX: 44
        run: node scripts/ci-verify-mysql-migration-upgrade.mjs
      - if: startsWith(matrix.suite, 'migration-upgrade-')
        run: node scripts/verify-api-usage-migration-schema.mjs post
      - if: matrix.suite == 'additive-release'
        env:
          FRONTMIND_RELEASE_MYSQL_ACCEPTANCE_REQUIRED: 1
          FRONTMIND_RELEASE_MYSQL_CLIENT_MODE: docker
        run: pnpm test:release:mysql-acceptance
      - if: matrix.suite == 'auth-transactions'
        env:
          FRONTMIND_AUTH_MYSQL_ACCEPTANCE_REQUIRED: 1
        run: pnpm exec vitest run scripts/auth-mysql-transaction-acceptance.test.ts

  promotion-merge-proof:
    name: Bind successful PR run to its exact test merge
    if: github.event_name == 'pull_request'
    needs:
      - quality
      - mysql-acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create canonical PR merge proof
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/write-promotion-merge-proof.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-name "Dashboard CI and release" \
            --workflow-path ".github/workflows/dashboard-ci.yml" \
            --output "$RUNNER_TEMP/promotion-merge-proof.json"
      - name: Upload exact PR merge proof
        uses: actions/upload-artifact@v4
        with:
          name: frontmind-production-merge-proof-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-merge-proof.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  build-sign-deploy:
    name: Build, sign and deploy immutable image
    needs:
      - changes
      - promotion-gate
      - quality
      - mysql-acceptance
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.mysql-acceptance.result == 'success' &&
      needs.promotion-gate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'repository_dispatch' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          needs.changes.result == 'success' &&
          needs.changes.outputs.pdf_runtime_changed != 'true'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.repository }}
      digest: ${{ steps.build.outputs.digest }}
      source_sha: ${{ needs.promotion-gate.outputs.source_sha }}
    env:
      FRONTMIND_RELEASE_SOURCE_SHA: ${{ needs.promotion-gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.promotion-gate.outputs.source_sha }}
      - name: Verify immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FRONTMIND_RELEASE_SOURCE_SHA"
          test "$GITHUB_SHA" = "$FRONTMIND_RELEASE_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repository=$repository" >>"$GITHUB_OUTPUT"
      - id: pdf
        shell: bash
        env:
          DISPATCHED_IMAGE: ${{ github.event.client_payload.pdf_runtime_image }}
          DISPATCHED_REVISION: ${{ github.event.client_payload.pdf_runtime_revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pdf_repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frontmind-dashboard-pdf-runtime"
          is_dispatch=false
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
            [[ "${DISPATCHED_REVISION:-}" =~ ^[a-f0-9]{64}$ ]] \
              || { echo 'PDF_RUNTIME_DISPATCH_REVISION_INVALID' >&2; exit 78; }
            [[ -n "${DISPATCHED_IMAGE:-}" ]] \
              || { echo 'PDF_RUNTIME_DISPATCH_IMAGE_MISSING' >&2; exit 78; }
            pdf_image="$DISPATCHED_IMAGE"
            is_dispatch=true
          else
            [[ -z "${DISPATCHED_IMAGE:-}" && -z "${DISPATCHED_REVISION:-}" ]] \
              || { echo 'PDF_RUNTIME_DISPATCH_PAYLOAD_UNEXPECTED' >&2; exit 78; }
            pdf_digest="$(docker buildx imagetools inspect "$pdf_repository:stable" --format '{{.Manifest.Digest}}')"
            [[ "$pdf_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            pdf_image="$pdf_repository@$pdf_digest"
          fi
          pdf_prefix="${pdf_repository}@"
          [[ "$pdf_image" == "$pdf_prefix"* ]] \
            || { echo 'PDF_RUNTIME_REPOSITORY_REJECTED' >&2; exit 78; }
          pdf_digest="${pdf_image#"$pdf_prefix"}"
          [[ "$pdf_digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo 'PDF_RUNTIME_DIGEST_INVALID' >&2; exit 78; }
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/pdf-runtime.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$pdf_image" >/dev/null
          image_revision="$(docker buildx imagetools inspect "$pdf_image" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$image_revision" =~ ^[a-f0-9]{40}$ ]] \
            || { echo 'PDF_RUNTIME_IMAGE_REVISION_INVALID' >&2; exit 78; }
          computed_revision="$(node scripts/assert-current-pdf-runtime-revision.mjs \
            --source-sha "$image_revision" --phase dashboard-base)"
          [[ "$computed_revision" =~ ^[a-f0-9]{64}$ ]]
          if [[ "$is_dispatch" == true ]]; then
            [[ "$computed_revision" == "$DISPATCHED_REVISION" ]] \
              || { echo 'PDF_RUNTIME_DISPATCH_REVISION_MISMATCH' >&2; exit 78; }
            released_digest="$(docker buildx imagetools inspect "$pdf_repository:released-current" \
              --format '{{.Manifest.Digest}}')"
            stable_digest="$(docker buildx imagetools inspect "$pdf_repository:stable" \
              --format '{{.Manifest.Digest}}')"
            [[ "$released_digest" == "$pdf_digest" && "$stable_digest" == "$pdf_digest" ]] \
              || { echo 'PDF_RUNTIME_DISPATCH_NOT_CURRENT_PROMOTION' >&2; exit 78; }
          fi
          echo "image=$pdf_image" >>"$GITHUB_OUTPUT"
          echo "revision=$computed_revision" >>"$GITHUB_OUTPUT"
          echo "source_sha=$image_revision" >>"$GITHUB_OUTPUT"
      - id: build
        name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/production/dashboard/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.repository }}:sha-${{ needs.promotion-gate.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.promotion-gate.outputs.source_sha }}
          build-args: |
            SOURCE_SHA=${{ needs.promotion-gate.outputs.source_sha }}
            IMAGE_VERSION=sha-${{ needs.promotion-gate.outputs.source_sha }}
            FRONTMIND_PDF_RUNTIME_IMAGE=${{ steps.pdf.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign exact application digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Install restricted deploy key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?DASHBOARD_DEPLOY_SSH_KEY is required}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/dashboard_deploy
          install -m 0644 .github/deploy/production_known_hosts ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/dashboard_deploy
          ssh-keygen -y -f ~/.ssh/dashboard_deploy >/dev/null
      - name: Deploy through fixed Dashboard capability
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DEPLOY_HOST: 149.88.85.148
          DEPLOY_PORT: "22"
          DEPLOY_USER: frontmind-deploy
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$GHCR_USERNAME" "$GHCR_TOKEN" |
            ssh -T \
              -i ~/.ssh/dashboard_deploy \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "$IMAGE@$DIGEST $FRONTMIND_RELEASE_SOURCE_SHA"
      - name: Record immutable successful-deployment marker
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/mark-ghcr-promoted.mjs --marker-prefix deployed
