# Temporary HTTP entrypoint for the first deployment stage.
# Install under 1Panel/OpenResty and reload after the dashboard container is healthy.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 149.88.85.240 _;

    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # Keep upgraded connections usable for app streaming. OpenResty accepts
        # the fixed value even for ordinary HTTP requests.
        proxy_set_header Connection "upgrade";
    }
}
