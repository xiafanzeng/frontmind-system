worker_processes auto;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream frontmind_dashboard { server 127.0.0.1:3001; keepalive 16; }
    upstream frontmind_umami { server 127.0.0.1:3010; keepalive 8; }
    upstream frontmind_website { server 127.0.0.1:8888; keepalive 16; }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name 149.88.85.240 _ dashboard.frontmind.cn;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 308 https://dashboard.frontmind.cn$request_uri; }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name www.frontmind.cn;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 308 https://www.frontmind.cn$request_uri; }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name dashboard.frontmind.cn;
        ssl_certificate /etc/ssl/frontmind/dashboard.fullchain.pem;
        ssl_certificate_key /etc/ssl/frontmind/dashboard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        location / {
            proxy_pass http://frontmind_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.frontmind.cn;
        ssl_certificate /etc/ssl/frontmind/website.fullchain.pem;
        ssl_certificate_key /etc/ssl/frontmind/website.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        location = /_fm-stats/script.js {
            proxy_pass http://frontmind_umami/script.js;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Set-Cookie;
        }
        location = /_fm-stats/api/send {
            if ($request_method != POST) { return 405; }
            if ($http_origin != "https://www.frontmind.cn") { return 403; }
            client_max_body_size 16k;
            proxy_pass http://frontmind_umami/api/send;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_hide_header Set-Cookie;
        }
        location ^~ /_fm-stats/ { return 404; }
        location / {
            proxy_pass http://frontmind_website;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
